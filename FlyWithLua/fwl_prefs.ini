;FlyWithLua Preference file
; 
;All lines begining with a ; are comments
;
;William R Good
;
;DeveloperMode = 0 Disabeled  = 1 Enabeled
DeveloperMode = 0
;
;VerboseMode = 0 Disabeled  = 1 Enabeled
VerboseMode = 0

;ImguiDebugPopup = 0 Disabeled  = 1 Enabeled
ImguiDebugPopup = 0

;ImguiMouseCursors = 0 Disabled  = 1 Enabled (dynamic ImGui mouse cursors inside windows)
ImguiMouseCursors = 1

;EnableScriptSubfolders = 0 Disabled (strictly load Scripts/ root files only)
;EnableScriptSubfolders = 1 Enabled (allow 1-level subfolders for standalone scripts and SkunkCrafts Updater)
EnableScriptSubfolders = 1

;SubfolderSetsScriptDirectory = 0 Option B: SCRIPT_DIRECTORY strictly points to Scripts/ root (use CURRENT_SCRIPT_DIRECTORY for subfolder)
;SubfolderSetsScriptDirectory = 1 Option A (default): SCRIPT_DIRECTORY dynamically points to the script's subfolder during execution
SubfolderSetsScriptDirectory = 1

;ImguiFontSize1 = 13 Initial font1 size
ImguiFontSize1 = 13

;ImguiFontSize2 = 16 Initial font2 size
ImguiFontSize2 = 16

;ImguiFontSize3 = 20 Initial font3 size
ImguiFontSize3 = 20

;ProggyCleanDefault = 0 You are using ProggyForever
;ProggyCleanDefault = 1 You are using ProggyClean
ProggyCleanDefault = 0

;UseCustomFonts = 0 You are not using custom fonts
;UseCustomFonts = 1 You are using custom fonts
UseCustomFonts = 0

;ImguiCustomFont1 = Roboto-Light.ttf This is one of the default fonts
;ImguiCustomFont1 = Your font name.ttf that you added to the Custom_Fonts folder
; It will use numbers 1-3  1 being font1 size
ImguiCustomFont1 = Roboto-Light.ttf

;ImguiCustomFont2 = Roboto-Regular.ttf This is one of the default fonts
;ImguiCustomFont2 = Your font name.ttf that you added to the Custom_Fonts folder
; It will use numbers 4-6  4 being font1 size
ImguiCustomFont2 = Roboto-Regular.ttf

;ImguiCustomFont3 = Roboto-Medium.ttf This is one of the default fonts
;ImguiCustomFont3 = Your font name.ttf that you added to the Custom_Fonts folder
; It will use numbers 7-9  7 being font1 size
ImguiCustomFont3 = Roboto-Medium.ttf

; -----------------------------------------------------------------------------
; Custom Named Font Definitions (Optional)
; -----------------------------------------------------------------------------
; You can define custom named font aliases and pixel sizes below.
; Format: Font.<AliasName> = <FontFileName.ttf>, <SizeInPixels>
; Fonts are loaded from the Resources/plugins/FlyWithLua/Custom_Fonts/ directory.
;
; In your Lua script, you can use either the alias or the font name:
;   imgui.PushFont("Roboto-Light-11")
;   imgui.PushFont("Heading")
;   imgui.PopFont()
;
; Examples (uncomment to activate):
; Font.Roboto-Light-11 = Roboto-Light.ttf, 11
; Font.Heading = Roboto-Medium.ttf, 24
; Font.BigText = Roboto-Regular.ttf, 36
