name: CMake

on:
  push:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Target SCU Depot Channel (or "none" to skip depot push)'
        required: true
        default: 'beta'
        type: choice
        options:
          - beta
          - release
          - all
          - none
      create_release:
        description: 'Tag for release history'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build-lin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install other dependancies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends freeglut3-dev libudev-dev libopenal-dev
      - name: Configure CMake
        working-directory: ${{github.workspace}}/src
        run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
      - name: Build
        working-directory: ${{github.workspace}}/src
        run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}            
      - uses: actions/upload-artifact@v7
        with:
          name: binaries-lin
          path: ${{github.workspace}}/build/lin_x64/FlyWithLua.xpl
          if-no-files-found: error
          
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: "Windows: Configure environment"
        shell: bash
        run: |
          # Select MinGW toolchain instead of the default MSVC.
          echo "CMAKE_GENERATOR=MinGW Makefiles" >> $GITHUB_ENV
      - name: Configure CMake
        working-directory: ${{github.workspace}}/src
        run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
      - name: Build
        working-directory: ${{github.workspace}}/src
        run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}            
      - uses: actions/upload-artifact@v7
        with:
          name: binaries-win
          path: ${{github.workspace}}/build/win_x64/FlyWithLua.xpl
          if-no-files-found: error

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Configure CMake
        working-directory: ${{github.workspace}}/src
        run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
      - name: Build
        working-directory: ${{github.workspace}}/src
        run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} 
      - uses: actions/upload-artifact@v7
        with:
          name: binaries-mac
          path: ${{github.workspace}}/build/mac_x64/FlyWithLua.xpl
          if-no-files-found: error

  package:
    needs: [build-lin, build-win, build-mac]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      
      - name: Ensure target directories exist
        run: mkdir -p FlyWithLua/lin_x64 FlyWithLua/win_x64 FlyWithLua/mac_x64    

      - name: Download Linux binary
        uses: actions/download-artifact@v8
        with:
          name: binaries-lin
          path: FlyWithLua/lin_x64

      - name: Download Windows binary
        uses: actions/download-artifact@v8
        with:
          name: binaries-win
          path: FlyWithLua/win_x64

      - name: Download Mac binary
        uses: actions/download-artifact@v8
        with:
          name: binaries-mac
          path: FlyWithLua/mac_x64

      - name: Verify binaries and architectures
        run: |
          ls -la FlyWithLua/lin_x64 FlyWithLua/win_x64 FlyWithLua/mac_x64
          lipo -info FlyWithLua/mac_x64/FlyWithLua.xpl

      - name: Resolve FlyWithLua version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW_TAG="${{ github.ref_name }}"
            FWL_VER="${RAW_TAG#v}"
          else
            FWL_VER=$(grep '#define PLUGIN_VERSION_NO' src/FlyWithLua.cpp | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          fi
          if [[ -z "$FWL_VER" ]]; then
            echo "Error: Could not resolve FlyWithLua version"
            exit 1
          fi
          echo "FWL_VERSION=$FWL_VER" >> $GITHUB_ENV
          echo "Resolved FlyWithLua version: $FWL_VER"

      - name: Upload packaging artifact
        uses: actions/upload-artifact@v7
        with:
          name: FlyWithLua_NG+_v${{env.FWL_VERSION}}
          path: |
            ${{github.workspace}}/FlyWithLua*
          if-no-files-found: error

      - name: Stage & Build SkunkCrafts Depot (Manual Dispatch)
        if: github.event_name == 'workflow_dispatch' && inputs.channel != 'none'
        run: |
          CHANNEL="${{ inputs.channel }}"
          echo "Building SCU depot for channel: $CHANNEL (version: ${{ env.FWL_VERSION }})"
          chmod +x deploy/stage.sh deploy/xpdepot.py
          ./deploy/stage.sh "$CHANNEL" --build-depot

      - name: Deploy to GitHub Pages (Depot)
        if: github.event_name == 'workflow_dispatch' && inputs.channel != 'none'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/depot
          keep_files: true

      - name: Package Standalone Release ZIP
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        run: |
          mkdir -p build/dist
          zip -rq "build/dist/FlyWithLua_NG+_v${{ env.FWL_VERSION }}.zip" FlyWithLua -x "*.DS_Store" "*/.gitkeep"

      - name: Tag for release history & Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.FWL_VERSION }}
          name: FlyWithLua ${{ env.FWL_VERSION }}
          generate_release_notes: true
          files: build/dist/FlyWithLua_NG+_v${{ env.FWL_VERSION }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}                     
