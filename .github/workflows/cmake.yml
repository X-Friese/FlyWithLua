name: "CMake: Build and create .zip bundle"

on:
  push:
  workflow_call:
    outputs:
      fwl_version:
        description: "Version string parsed from src/FlyWithLua.cpp"
        value: ${{ jobs.package.outputs.fwl_version }}

permissions:
  contents: read

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build-lin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install other dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends freeglut3-dev libudev-dev libopenal-dev
      - name: Configure CMake
        working-directory: ${{ github.workspace }}/src
        run: cmake -B ${{ github.workspace }}/build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
      - name: Build
        working-directory: ${{ github.workspace }}/src
        run: cmake --build ${{ github.workspace }}/build --config ${{ env.BUILD_TYPE }}
      - uses: actions/upload-artifact@v7
        with:
          name: binaries-lin
          path: ${{ github.workspace }}/build/lin_x64/FlyWithLua.xpl
          if-no-files-found: error

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: "Windows: Configure environment"
        shell: bash
        run: |
          # Select MinGW toolchain instead of the default MSVC.
          echo "CMAKE_GENERATOR=MinGW Makefiles" >> "$GITHUB_ENV"
      - name: Configure CMake
        working-directory: ${{ github.workspace }}/src
        run: cmake -B ${{ github.workspace }}/build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
      - name: Build
        working-directory: ${{ github.workspace }}/src
        run: cmake --build ${{ github.workspace }}/build --config ${{ env.BUILD_TYPE }}
      - uses: actions/upload-artifact@v7
        with:
          name: binaries-win
          path: ${{ github.workspace }}/build/win_x64/FlyWithLua.xpl
          if-no-files-found: error

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Configure CMake
        working-directory: ${{ github.workspace }}/src
        run: cmake -B ${{ github.workspace }}/build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
      - name: Build
        working-directory: ${{ github.workspace }}/src
        run: cmake --build ${{ github.workspace }}/build --config ${{ env.BUILD_TYPE }}
      - uses: actions/upload-artifact@v7
        with:
          name: binaries-mac
          path: ${{ github.workspace }}/build/mac_x64/FlyWithLua.xpl
          if-no-files-found: error

  package:
    needs: [build-lin, build-win, build-mac]
    runs-on: macos-latest
    outputs:
      fwl_version: ${{ steps.resolve_version.outputs.fwl_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Ensure target directories exist
        run: |
          mkdir -p FlyWithLua/lin_x64 FlyWithLua/win_x64 FlyWithLua/mac_x64
          rm -f FlyWithLua/lin_x64/.gitkeep FlyWithLua/mac_x64/.gitkeep

      - name: Download Linux binary
        uses: actions/download-artifact@v8
        with:
          name: binaries-lin
          path: FlyWithLua/lin_x64

      - name: Download Windows binary
        uses: actions/download-artifact@v8
        with:
          name: binaries-win
          path: FlyWithLua/win_x64

      - name: Download Mac binary
        uses: actions/download-artifact@v8
        with:
          name: binaries-mac
          path: FlyWithLua/mac_x64

      - name: Verify binaries and architectures
        run: |
          ls -la FlyWithLua/lin_x64 FlyWithLua/win_x64 FlyWithLua/mac_x64
          lipo -info FlyWithLua/mac_x64/FlyWithLua.xpl

      - name: Resolve FlyWithLua version
        id: resolve_version
        run: |
          FWL_VER=$(grep '#define PLUGIN_VERSION_NO' src/FlyWithLua.cpp | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [[ -z "$FWL_VER" ]]; then
            echo "::error::Could not resolve PLUGIN_VERSION_NO from src/FlyWithLua.cpp"
            exit 1
          fi
          echo "FWL_VERSION=$FWL_VER" >> "$GITHUB_ENV"
          echo "fwl_version=$FWL_VER" >> "$GITHUB_OUTPUT"
          echo "Resolved FlyWithLua version: $FWL_VER"

      - name: Upload packaging artifact
        uses: actions/upload-artifact@v7
        with:
          name: FlyWithLua_NG+_v${{ env.FWL_VERSION }}
          path: |
            ${{ github.workspace }}/FlyWithLua*
          if-no-files-found: error
